<!DOCTYPE html>
<html>
<head>
  <title>Register | Campus Care</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <p class="sub">Register to report campus wastage</p>

    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="field">
        <span>👤</span>
        <input type="text" name="name" placeholder="Full Name" required>
      </div>
      <div class="field">
        <span>📧</span>
        <input type="email" name="email" placeholder="Email" required>
      </div>
      <div class="field">
        <span>🔒</span>
        <input type="password" name="password" id="pw" placeholder="Password" required>
        <span class="eye" onclick="togglePw()">👁</span>
      </div>
      <button class="btn">Register</button>
    </form>

    <p class="link">Already have an account? <a href="/login">Login</a></p>
  </div>

  <script>
    function togglePw() {
      var p = document.getElementById("pw");
      p.type = (p.type === "password") ? "text" : "password";
    }
  </script>
</body>
</html>
